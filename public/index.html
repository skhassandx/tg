<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Login</title>
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }
        img#qr-code { 
            width: 250px; 
            height: 250px; 
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="login-box" id="login-container">
        <h2>অ্যাপে প্রবেশ করতে স্ক্যান করুন</h2>
        <img id="qr-code" src="" alt="QR Code লোড হচ্ছে...">
        <p>আপনার হোয়াটসঅ্যাপের Linked Devices অপশন থেকে স্ক্যান করুন</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        socket.on('qr', (qrUrl) => {
            document.getElementById('qr-code').src = qrUrl;
        });

        socket.on('authenticated', (url) => {
            document.body.innerHTML = `<iframe src="${url}" style="width:100%; height:100vh; border:none; margin:0; padding:0;"></iframe>`;
        });
    </script>
</body>
  </html>
